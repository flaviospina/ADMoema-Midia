; public/.user.ini — ajustes de PHP para o HostGator (vale para esta pasta)
; O envio é feito em partes de 2 MB, então estes limites são folgados.
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 120
memory_limit = 512M
max_file_uploads = 5
expose_php = Off
display_errors = Off
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
